<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgMedi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041214"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMedi)"/>
  <!-- ECG / Pulse Line -->
  <path d="M0,225 L240,225 L260,200 L280,260 L300,160 L320,280 L340,225 L800,225" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
