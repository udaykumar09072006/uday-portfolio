  <rect x="30" y="30" width="220" height="60" rx="8" fill="#06181b" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.4"/>
  <text x="45" y="52" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold">MEDICARE PLATFORM</text>
  <text x="45" y="72" fill="#94a3b8" font-family="monospace" font-size="10">SMART HEALTHCARE &amp; RBAC</text>
  <rect x="580" y="30" width="190" height="40" rx="6" fill="#06181b" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.4"/>
  <circle cx="600" cy="50" r="4" fill="#2dd4bf"/>
  <text x="615" y="54" fill="#2dd4bf" font-family="monospace" font-size="11" font-weight="bold">CLINIC DISPATCH</text>
</svg>
