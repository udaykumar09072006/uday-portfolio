<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgResume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#02050a"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgResume)"/>
  <!-- Central Resume Sheet Mockup -->
  <g transform="translate(250, 60)">
    <rect width="300" height="340" rx="8" fill="#0c1524" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Document Header -->
    <rect x="25" y="25" width="120" height="14" rx="3" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="25" y="45" width="200" height="6" rx="2" fill="#64748b" fill-opacity="0.6"/>
    <!-- Document Sections -->
    <line x1="25" y1="65" x2="275" y2="65" stroke="#1e293b" stroke-width="1"/>
    <rect x="25" y="80" width="70" height="8" rx="2" fill="#34d399" fill-opacity="0.8"/>
    <rect x="25" y="96" width="240" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <rect x="25" y="107" width="220" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <rect x="25" y="118" width="180" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <!-- Section 2 -->
    <rect x="25" y="145" width="80" height="8" rx="2" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="25" y="161" width="250" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <rect x="25" y="172" width="230" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <rect x="25" y="183" width="200" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <!-- Score Gauge in Document Corner -->
    <circle cx="245" cy="40" r="18" fill="#070e1a" stroke="#34d399" stroke-width="2.5"/>
    <text x="245" y="44" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ATS</text>
  </g>
  <!-- HUD Badges -->
  <rect x="30" y="30" width="200" height="60" rx="8" fill="#07101e" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="45" y="52" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RESUME BUILDER</text>
  <text x="45" y="72" fill="#94a3b8" font-family="monospace" font-size="10">ATS CHECKER &amp; EXPORT</text>
  <rect x="580" y="30" width="190" height="40" rx="6" fill="#07101e" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.4"/>
  <circle cx="600" cy="50" r="4" fill="#34d399"/>
  <text x="615" y="54" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">ATS OPTIMIZED</text>
</svg>
