<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgRisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0714"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgRisk)"/>
  <!-- Radar circles -->
  <circle cx="400" cy="225" r="180" fill="none" stroke="#ef4444" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="400" cy="225" r="120" fill="none" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="400" cy="225" r="60" fill="none" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="400" y1="45" x2="400" y2="405" stroke="#ef4444" stroke-opacity="0.2"/>
  <line x1="220" y1="225" x2="580" y2="225" stroke="#ef4444" stroke-opacity="0.2"/>
  <circle cx="400" cy="225" r="190" fill="url(#radarGlow)"/>
  <!-- Sweep line -->
  <line x1="400" y1="225" x2="520" y2="105" stroke="#ff4d4d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Anomalies -->
  <g fill="#ff3344">
    <circle cx="470" cy="140" r="5"/>
    <circle cx="470" cy="140" r="12" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.6"/>
    <circle cx="340" cy="280" r="4"/>
    <circle cx="380" cy="190" r="4"/>
  </g>
  <!-- HUD Labels -->
  <rect x="30" y="30" width="200" height="60" rx="8" fill="#15081c" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.4"/>
  <text x="45" y="52" fill="#fb7185" font-family="monospace" font-size="12" font-weight="bold">RISKORA AI</text>
  <text x="45" y="72" fill="#94a3b8" font-family="monospace" font-size="10">FRAUD DETECTION ENGINE</text>
  <rect x="580" y="30" width="190" height="40" rx="6" fill="#15081c" fill-opacity="0.85" stroke="#fb7185" stroke-opacity="0.4"/>
  <circle cx="600" cy="50" r="4" fill="#fb7185"/>
  <text x="615" y="54" fill="#fb7185" font-family="monospace" font-size="11" font-weight="bold">RADAR ACTIVE</text>
</svg>
