<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Isometric Grid -->
  <g stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1">
    <path d="M0,225 L400,25 L800,225 L400,425 Z"/>
    <path d="M100,225 L400,75 L700,225 L400,375 Z"/>
    <path d="M200,225 L400,125 L600,225 L400,325 Z"/>
    <line x1="400" y1="25" x2="400" y2="425"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
  </g>
  <!-- Ambient glow -->
  <circle cx="400" cy="225" r="180" fill="url(#glowPulse)"/>
  <!-- Holographic 3D Cubes / Servers -->
  <g transform="translate(400, 200)">
    <!-- Central Node -->
    <polygon points="0,-40 40,-20 40,20 0,40 -40,20 -40,-20" fill="#08182b" stroke="#00f0ff" stroke-width="2"/>
    <polygon points="0,-40 40,-20 0,0 -40,-20" fill="#0d2b4d" stroke="#00f0ff" stroke-width="1.5"/>
    <polygon points="0,0 40,-20 40,20 0,40" fill="#071b30" stroke="#00f0ff" stroke-width="1.5"/>
    <polygon points="-40,-20 0,0 0,40 -40,20" fill="#041224" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Orbiting Left Node -->
    <polygon points="-120,-10 -90,5 -90,35 -120,50 -150,35 -150,5" fill="#061f1c" stroke="#00ff88" stroke-width="1.5"/>
    <!-- Orbiting Right Node -->
    <polygon points="120,-10 150,5 150,35 120,50 90,35 90,5" fill="#180e2b" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Connection rays -->
    <line x1="-90" y1="20" x2="-40" y2="10" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="90" y1="20" x2="40" y2="10" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
  </g>
  <!-- UI HUD Overlays -->
  <rect x="30" y="30" width="220" height="60" rx="8" fill="#070e1a" fill-opacity="0.85" stroke="#00f0ff" stroke-opacity="0.3"/>
  <text x="45" y="52" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">SCALECHECK 3D</text>
  <text x="45" y="72" fill="#94a3b8" font-family="monospace" font-size="10">ARCHITECTURE TELEMETRY</text>
  <rect x="580" y="30" width="190" height="40" rx="6" fill="#070e1a" fill-opacity="0.85" stroke="#00ff88" stroke-opacity="0.3"/>
  <circle cx="600" cy="50" r="4" fill="#00ff88"/>
  <text x="615" y="54" fill="#00ff88" font-family="monospace" font-size="11" font-weight="bold">SYSTEM STABLE</text>
</svg>
