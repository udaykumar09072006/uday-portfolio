<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgStudy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f071e"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgStudy)"/>
  <circle cx="400" cy="225" r="180" fill="url(#purpleGlow)"/>
  <!-- Neural Study Network / Brain Graph -->
  <g stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="400" y1="180" x2="330" y2="240"/>
    <line x1="400" y1="180" x2="470" y2="240"/>
    <line x1="330" y1="240" x2="350" y2="300"/>
    <line x1="470" y1="240" x2="450" y2="300"/>
    <line x1="350" y1="300" x2="450" y2="300"/>
    <line x1="400" y1="180" x2="400" y2="280"/>
  </g>
  <!-- Nodes -->
  <g fill="#c084fc">
    <circle cx="400" cy="180" r="10" stroke="#f3e8ff" stroke-width="2"/>
    <circle cx="330" cy="240" r="8"/>
    <circle cx="470" cy="240" r="8"/>
    <circle cx="350" cy="300" r="7"/>
    <circle cx="450" cy="300" r="7"/>
    <circle cx="400" cy="280" r="6"/>
  </g>
  <!-- Open Book & AI Sparkles Icon -->
  <g transform="translate(400, 225)">
    <path d="M-40,10 C-20,-5 -5,-5 0,5 C5,-5 20,-5 40,10 L40,40 C20,25 5,25 0,35 C-5,25 -20,25 -40,40 Z" fill="#1e1035" stroke="#a855f7" stroke-width="2"/>
  </g>
  <!-- HUD Badges -->
  <rect x="30" y="30" width="220" height="60" rx="8" fill="#1a0c2e" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="45" y="52" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">AI STUDY ASSISTANT</text>
  <text x="45" y="72" fill="#94a3b8" font-family="monospace" font-size="10">SYNTHESIS &amp; QUIZ TUTOR</text>
  <rect x="580" y="30" width="190" height="40" rx="6" fill="#1a0c2e" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.4"/>
  <circle cx="600" cy="50" r="4" fill="#c084fc"/>
  <text x="615" y="54" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">AI COGNITION ON</text>
</svg>
